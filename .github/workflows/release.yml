name: Build Windows EXE & Publish Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release 版本号（例如 v2.10.1-local）
        required: false
        default: "v2.10.1-local"
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install frontend & desktop dependencies
        run: |
          npm --prefix frontend ci
          npm --prefix desktop ci

      - name: Build frontend static UI
        run: |
          npm --prefix desktop run build:ui

      - name: Build pure-Python backend EXE (PyInstaller)
        run: |
          npm --prefix desktop run build:backend

      - name: Build Windows Setup EXE (electron-builder)
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: |
          npm --prefix desktop run build:icon
          npx --prefix desktop electron-builder --win --x64 --publish never

      - name: Stage release EXE artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release-exe | Out-Null
          Get-ChildItem desktop/dist/*.exe | Copy-Item -Destination release-exe/ -Force
          if (Test-Path desktop/resources/backend/wechat-backend.exe) {
            Copy-Item desktop/resources/backend/wechat-backend.exe release-exe/wechat-backend.exe -Force
          }
          Get-ChildItem release-exe

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: WeChatDataAnalysis-windows-x64-exe
          path: release-exe/*.exe

      - name: Publish to GitHub Releases
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_TAG: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          $tag = if ($env:REF_TYPE -eq "tag") { $env:REF_NAME } elseif ($env:INPUT_TAG) { $env:INPUT_TAG } else { "v2.10.1-local" }
          if (-not $tag.StartsWith("v")) { $tag = "v$tag" }
          $notes = @(
            "## WeChatDataAnalysis（Windows x64 内网自用去限制版）",
            "",
            "- 已解除 45 天硬过期限制与闭源 `native_core` / `wechatdb_broker.exe` 强绑定，默认使用本地已解密 SQLite（`decrypted` 模式）",
            "- 已移除 `license.fqyw.love` 在线租约校验、4xx 强杀进程与操作遥测上报",
            "- 已移除 `view.free.c3o.re` 图片密钥回退自动上传 `global_config` 逻辑",
            "- 已移除 `wce_integrity.pyd` 与 `.wec`/`.wes` 闭源导出封签加密壳，全部导出纯 Python 化（直接生成标准 HTML/CSS 与标准 ZIP）",
            "- 已移除 WxCDN 付费流量配额及前端所有 PRO 付费推广弹窗与无后端占位按钮"
          ) -join "`n"
          $exists = $false
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) { $exists = $true }
          if ($exists) {
            gh release upload $tag release-exe/*.exe --clobber
            gh release edit $tag --title "WeChatDataAnalysis $tag (Windows x64 去限制版)" --notes $notes
          } else {
            gh release create $tag release-exe/*.exe --title "WeChatDataAnalysis $tag (Windows x64 去限制版)" --notes $notes
          }
